# =====================================================================
# java-agent-hub 一键启动编排
# 用法：
#   1. 构建应用镜像: mvn clean package -DskipTests && docker build -t agenthub:1.0.0 .
#   2. 启动全部依赖: docker compose up -d mysql pgvector rocketmq minio
#   3. 启动应用:     docker compose up -d agenthub
# 快速体验（不构建镜像，本地 IDE 运行应用，只起依赖）:
#   docker compose up -d mysql pgvector
# =====================================================================

services:
  # ---------- MySQL 8：业务主库（自动执行 sql/init-mysql.sql） ----------
  mysql:
    image: mysql:8.0
    container_name: agenthub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: agenthub
      MYSQL_USER: agenthub
      MYSQL_PASSWORD: agenthub123
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init-mysql.sql:/docker-entrypoint-initdb.d/init-mysql.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uagenthub", "-pagenthub123"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- PostgreSQL + pgvector：向量库（自动执行 sql/init-pgvector.sql） ----------
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: agenthub-pgvector
    environment:
      POSTGRES_USER: agenthub
      POSTGRES_PASSWORD: agenthub123
      POSTGRES_DB: agenthub_vector
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data
      - ./sql/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agenthub -d agenthub_vector"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- RocketMQ 5：异步任务（文档解析/向量化） ----------
  rocketmq:
    image: apache/rocketmq:5.3.0
    container_name: agenthub-rocketmq
    environment:
      JAVA_OPT_EXT: "-server -Xms512m -Xmx512m"
    ports:
      - "9876:9876"   # NameServer
      - "10909:10909" # Broker 对外
      - "10911:10911" # Broker 内部
    volumes:
      - rocketmq-data:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9876/cluster/list.query || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- MinIO：对象存储（可切换 local 磁盘模式） ----------
  minio:
    image: minio/minio:latest
    container_name: agenthub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Ollama：本地 LLM + Embedding（可选，需在有GPU/大内存机器上运行） ----------
  ollama:
    image: ollama/ollama:latest
    container_name: agenthub-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # ---------- OpenTelemetry Collector：接收 OTLP → Jaeger/Prometheus ----------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: agenthub-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "9464:9464"   # Prometheus 拉取
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    depends_on:
      - jaeger

  # ---------- Jaeger：链路可视化 ----------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: agenthub-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4317:4317"

  # ---------- MinerU：高精度文档解析（可选，GPU 环境推荐） ----------
  # 如需启用：解除注释并按 https://github.com/opendatalab/MinerU 部署后设置
  # PARSER_PROVIDER=mineru、MINERU_HOST=mineru
  # mineru:
  #   image: opendatalab/mineru:latest
  #   profiles: ["parser"]
  #   ports:
  #     - "30000:30000"

  # ---------- 应用 ----------
  agenthub:
    build: .
    image: agenthub:1.0.0
    container_name: agenthub-app
    depends_on:
      mysql:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: agenthub
      MYSQL_PASSWORD: agenthub123
      PG_HOST: pgvector
      PG_PORT: 5432
      PG_USER: agenthub
      PG_PASSWORD: agenthub123
      PG_DB: agenthub_vector
      # 依赖逐步启用：默认 local 模式（进程内异步 + 本地磁盘存储 + Mock 模型）
      MQ_TYPE: ${MQ_TYPE:-local}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      LLM_DEFAULT_MODEL: ${LLM_DEFAULT_MODEL:-mock-chat}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-mock-embed}
      AGENT_ENGINE: ${AGENT_ENGINE:-builtin}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      # 启用 RocketMQ/MinIO/真实模型时切换：
      # MQ_TYPE: rocketmq
      # ROCKETMQ_NAMESRV: rocketmq:9876
      # STORAGE_TYPE: minio
      # MINIO_HOST: minio
      # LLM_DEFAULT_MODEL: qwen2.5:7b
      # EMBEDDING_MODEL: ollama-embed
      # OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql-data:
  pgvector-data:
  rocketmq-data:
  minio-data:
  ollama-data:
